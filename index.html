<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конференции и мероприятия</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#111}button,input{font:inherit}button,a,input{touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}

:root{--accent:#2563eb;--accent-2:#7c3aed;--accent-3:#f59e0b;--bg-soft:#f5f7ff}
body{background:linear-gradient(180deg,#eef2ff 0%,#fafbff 220px,#fafbff 100%)}
#site-header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:linear-gradient(120deg,#1e3a8a 0%,#2563eb 45%,#7c3aed 100%);box-shadow:0 4px 20px rgba(37,99,235,.25);gap:16px}
#site-header h1{font-size:21px;margin:0;color:#fff;font-weight:700;letter-spacing:.2px}.header-actions{display:flex;gap:12px;align-items:center}.lang-switch{display:flex;gap:5px}
.lang-switch button,.admin-link{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:20px;cursor:pointer;color:#fff;font-size:14px;text-decoration:none;transition:background .15s}.lang-switch button:hover,.admin-link:hover{background:rgba(255,255,255,.25)}.lang-switch button.active{background:#fff;color:#2563eb;border-color:#fff;font-weight:600}
#badges-app{max-width:1400px;margin:0 auto;background:transparent}.page-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding:20px;align-items:start}.left-col{display:flex;flex-direction:column;gap:16px;min-width:0}
#debug-banner{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:13px;margin:12px 20px;font-family:monospace;white-space:pre-wrap;overflow-wrap:anywhere}
#timeline-wrap{position:relative;width:100%;min-width:0;min-height:220px;background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(37,99,235,.08);padding-top:4px}#timeline-scroll{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;flex-wrap:nowrap;padding:40px 10px 20px;width:100%;min-height:220px;scroll-behavior:smooth;scrollbar-width:none}#timeline-scroll::-webkit-scrollbar{display:none}#timeline-wrap::before,#timeline-wrap::after{content:"";position:absolute;top:0;bottom:0;width:28px;pointer-events:none;z-index:3;border-radius:18px}#timeline-wrap::before{left:0;background:linear-gradient(to right,#fff,transparent)}#timeline-wrap::after{right:0;background:linear-gradient(to left,#fff,transparent)}#timeline-empty-msg{color:#6b7280;font-size:14px;padding:20px}
.badge-item{position:relative;flex:0 0 auto;width:60px;text-align:center;cursor:pointer;height:220px;margin-right:-16px;transition:transform .15s}.badge-item:hover{transform:translateY(-4px)}.badge-item .year-label{position:absolute;top:-20px;left:0;right:0;font-weight:700;color:var(--accent-2);font-size:16px}.badge-hook{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none}.badge-item img{position:absolute;top:17px;left:5px;width:100%;height:170px;object-fit:contain;z-index:1;background:transparent;filter:drop-shadow(0 6px 10px rgba(37,99,235,.15))}.badge-item.single-photo .badge-hook{z-index:0}.badge-item.single-photo img{top:-50px;height:180px;z-index:1}.badge-item.single-photo{width:90px;margin-right:6px}.badge-item.selected img{filter:drop-shadow(0 0 8px var(--accent-2))}
#tag-filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 20px}.tag-filter-chip{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:2px solid #e5e7eb;background:#fff;color:#374151;user-select:none;transition:transform .12s,box-shadow .12s;box-shadow:0 1px 4px rgba(0,0,0,.04)}.tag-filter-chip:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.1)}.tag-filter-chip.active{border-color:transparent;color:#fff}.tag-filter-chip.all-chip{font-weight:600}.tag-filter-chip.all-chip.active{background:linear-gradient(120deg,#1e3a8a,#7c3aed);color:#fff}
#map{height:480px;width:100%;border-radius:18px;box-shadow:0 8px 28px rgba(37,99,235,.15);border:3px solid #fff;overflow:hidden}.map-flag-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;width:16px}.map-flag-icon{width:16px;height:20px;transform-origin:1px 19px;transition:transform .15s;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}#map.zoom-close .map-flag-icon{transform:scale(1.6)}.map-flag-wrap.selected .map-flag-icon{filter:drop-shadow(0 0 4px var(--accent-2))}.map-message{padding:20px;color:#6b7280;font-size:14px}
.right-col{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(37,99,235,.12);min-height:500px;position:sticky;top:20px;border-top:5px solid var(--accent);min-width:0}.info-empty{color:#6b7280;font-size:14px}.info-header{display:flex;align-items:flex-start;gap:12px}.info-number{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(124,58,237,.35)}.info-header-text{flex:1;min-width:0}.info-header h2{margin:0 0 4px;font-size:20px;overflow-wrap:anywhere}.info-date{color:#6b7280;font-size:14px;margin-bottom:14px;padding-top:4px}.info-photos-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.info-photos-row img{height:140px;width:auto;max-width:100%;border-radius:12px;border:1px solid #e5e7eb;object-fit:contain;cursor:zoom-in;box-shadow:0 4px 12px rgba(0,0,0,.06)}.info-carousel{display:flex;gap:10px;overflow-x:auto;margin-bottom:14px;padding-bottom:6px}.info-carousel img{height:140px;width:auto;flex:0 0 auto;border-radius:12px;border:1px solid #e5e7eb;object-fit:contain;cursor:zoom-in;box-shadow:0 4px 12px rgba(0,0,0,.06)}.info-desc{font-size:14px;line-height:1.6;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}.info-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.tag-chip{padding:5px 12px;border-radius:20px;font-size:12px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}.talk-file{display:inline-block;margin-top:10px;padding:9px 16px;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;border-radius:10px;text-decoration:none;font-size:14px;box-shadow:0 4px 12px rgba(37,99,235,.3);transition:transform .12s}.talk-file:hover{transform:translateY(-1px)}.info-gallery-title{font-size:13px;font-weight:600;color:var(--accent-2);margin:16px 0 8px;border-top:1px solid #e5e7eb;padding-top:14px}
.zoomable-photo{cursor:zoom-in}#lightbox-overlay{position:fixed;inset:0;background:rgba(15,15,30,.9);display:none;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out}#lightbox-overlay.open{display:flex}#lightbox-overlay img{max-width:92vw;max-height:92vh;object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}#lightbox-close{position:absolute;top:20px;right:30px;color:#fff;font-size:32px;cursor:pointer;background:none;border:none;line-height:1}
@media(max-width:1000px){.page-grid{grid-template-columns:minmax(0,1fr)}.right-col{position:static;min-height:200px}}@media(max-width:600px){#site-header{padding:16px;flex-direction:column;align-items:flex-start}#site-header h1{font-size:19px}.page-grid{padding:12px;gap:16px}.right-col{padding:18px}#map{height:360px}#tag-filter-bar{padding:0 6px}}

</style>
</head>
<body>
<header id="site-header">
<h1 id="site-title">Конференции и мероприятия</h1>
<div class="header-actions"><div class="lang-switch"><button type="button" data-lang="ru" id="lang-ru-btn">RU</button><button type="button" data-lang="en" id="lang-en-btn">EN</button></div><a class="admin-link" href="./admin.html" id="admin-link-text">Админ</a></div>
</header>
<div id="debug-banner" role="status" aria-live="polite"></div>
<main id="badges-app"><div class="page-grid"><div class="left-col"><div id="timeline-wrap"><div id="timeline-scroll"></div></div><div id="tag-filter-bar"></div><div id="map"><div class="map-message">Загрузка карты…</div></div></div>
<aside class="right-col" id="right-panel"><div class="info-empty" id="info-empty">Выберите бейджик на ленте или на карте</div><div id="info-content" style="display:none"><div class="info-header"><div class="info-number" id="info-number"></div><div class="info-header-text"><h2 id="info-title"></h2><div class="info-date" id="info-date"></div></div></div><div id="info-photos-container"></div><div class="info-desc" id="info-desc"></div><div class="info-tags" id="info-tags"></div><div id="info-talk"></div><div id="info-gallery-container"></div></div></aside></div></main>
<div id="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Просмотр фотографии"><button type="button" id="lightbox-close" aria-label="Закрыть">&times;</button><img id="lightbox-img" alt="Увеличенная фотография"></div>

<script>

(function(){
"use strict";
const BACKEND_URL="https://functions.yandexcloud.net/d4e2ne6v7giu3cm7treu";
const MAP_API_KEY="dfbfb335-c5b2-4a88-9755-fb9ee3087276";
const FAR_ZOOM_THRESHOLD=6,CLOSE_ZOOM_THRESHOLD=8,CLUSTER_GRID_SIZE=32;
let ALL_EVENTS=[],selectedId=null,map,plainCollection,clusterer,FlagLayout,currentMode=null;
const activeTagFilters=new Set();
const $=id=>document.getElementById(id);
function showDebug(text){const el=$("debug-banner");el.textContent+=(el.textContent?"\n\n":"")+text;el.style.display="block";}
window.addEventListener("error",e=>{if(e.message)showDebug("JS-ошибка: "+e.message);});
window.addEventListener("unhandledrejection",e=>showDebug("Ошибка: "+(e.reason?.message||String(e.reason))));
const UI_TEXT={ru:{siteTitle:"Конференции и мероприятия",admin:"Админ",empty:"Выберите бейджик на ленте или на карте",talk:"Материалы доклада",noEvents:"Нет мероприятий для отображения",allTags:"Все теги",gallery:"Дополнительные фото"},en:{siteTitle:"Conferences & Events",admin:"Admin",empty:"Select a badge from the timeline or the map",talk:"Talk materials",noEvents:"No events to display",allTags:"All tags",gallery:"Additional photos"}};
let lang="ru";try{const saved=localStorage.getItem("siteLang");if(saved==="ru"||saved==="en")lang=saved;}catch(e){}
function getLang(){return lang;}
function applyUiText(){const t=UI_TEXT[lang];document.documentElement.lang=lang;document.title=t.siteTitle;$("site-title").textContent=t.siteTitle;$("admin-link-text").textContent=t.admin;$("info-empty").textContent=t.empty;["ru","en"].forEach(l=>{$("lang-"+l+"-btn").classList.toggle("active",l===lang);$("lang-"+l+"-btn").setAttribute("aria-pressed",String(l===lang));});}
function setLang(value){lang=value;try{localStorage.setItem("siteLang",lang);}catch(e){}applyUiText();renderTagFilterBar();renderTimeline();renderMap();if(selectedId!==null)selectEvent(selectedId,false);}
function evTitle(ev){return (lang==="ru"?ev.title_ru:ev.title_en)||ev.title_ru||ev.title_en||"";}
function evDesc(ev){return (lang==="ru"?ev.description_ru:ev.description_en)||ev.description_ru||ev.description_en||"";}
function imgUrl(path){return path?BACKEND_URL+"?action=image&path="+encodeURIComponent(path):"";}
function photosOf(ev){return Array.isArray(ev.photos)?ev.photos.filter(Boolean):[];}
function galleryOf(ev){return Array.isArray(ev.gallery_photos)?ev.gallery_photos.filter(Boolean):[];}
function tagsOf(ev){return Array.isArray(ev.tags)?ev.tags.filter(t=>t&&typeof t.name==="string"&&t.name.trim()):[];}
function safeColor(value){return /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(String(value))?value:"#2563eb";}
function coords(ev){if(ev.lat==null||ev.lon==null||String(ev.lat).trim()===""||String(ev.lon).trim()==="")return null;const lat=Number(ev.lat),lon=Number(ev.lon);return Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180?[lat,lon]:null;}
function fmtDateRange(ev){const start=ev.date_start||"",end=ev.date_end||start;return start===end?start:start+" — "+end;}
function yearOf(ev){return ev.year||String(ev.date_start||"").slice(0,4);}
const HOOK_SVG='<svg class="badge-hook" width="24" height="32" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="6" r="4.5" fill="#6b7280"/><path d="M12 10V19C12 23 15 25.5 18 23.5C20.3 22 19.8 18.7 17.5 18.2C16 17.9 15.2 19 15.6 20.3" stroke="#6b7280" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>';
function flagSvg(color){return '<svg class="map-flag-icon" width="16" height="20" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg"><line x1="1" y1="1" x2="1" y2="19" stroke="#374151" stroke-width="1.6"/><path d="M1 1 L15 5 L1 9 Z" fill="'+safeColor(color)+'"/></svg>';}
function getAllTags(){const seen=new Map();ALL_EVENTS.forEach(ev=>tagsOf(ev).forEach(t=>{const key=t.name.toLowerCase();if(!seen.has(key))seen.set(key,t);}));return Array.from(seen.values());}
function visibleEvents(){return !activeTagFilters.size?ALL_EVENTS:ALL_EVENTS.filter(ev=>tagsOf(ev).some(t=>activeTagFilters.has(t.name.toLowerCase())));}
function chronologicalNumber(id){const i=ALL_EVENTS.findIndex(e=>String(e.id)===String(id));return i<0?"":i+1;}
function renderTagFilterBar(){const bar=$("tag-filter-bar");bar.replaceChildren();const all=document.createElement("button");all.type="button";all.className="tag-filter-chip all-chip"+(!activeTagFilters.size?" active":"");all.textContent=UI_TEXT[lang].allTags;all.setAttribute("aria-pressed",String(!activeTagFilters.size));all.addEventListener("click",()=>{activeTagFilters.clear();renderTagFilterBar();renderTimeline();renderMap();});bar.appendChild(all);getAllTags().forEach(t=>{const chip=document.createElement("button"),key=t.name.toLowerCase(),active=activeTagFilters.has(key);chip.type="button";chip.className="tag-filter-chip"+(active?" active":"");chip.style.borderColor=safeColor(t.color);if(active)chip.style.background=safeColor(t.color);else chip.style.color=safeColor(t.color);chip.textContent=t.name;chip.setAttribute("aria-pressed",String(active));chip.addEventListener("click",()=>{if(activeTagFilters.has(key))activeTagFilters.delete(key);else activeTagFilters.add(key);renderTagFilterBar();renderTimeline();renderMap();});bar.appendChild(chip);});}
async function loadEvents(){try{const res=await fetch(BACKEND_URL+"?action=events&_="+Date.now(),{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status+": "+(await res.text()).slice(0,300));const data=await res.json();if(!Array.isArray(data))throw new Error("Сервер вернул не список мероприятий");ALL_EVENTS=data.filter(ev=>ev&&typeof ev==="object");ALL_EVENTS.sort((a,b)=>(Date.parse(a.date_start)||0)-(Date.parse(b.date_start)||0));renderTagFilterBar();renderTimeline();renderMap();}catch(err){showDebug("Не удалось загрузить мероприятия: "+err.message+"\nЕсли это ошибка CORS, разрешите новый GitHub Pages origin в облачной функции.");}}
function renderTimeline(){const box=$("timeline-scroll");box.replaceChildren();const events=visibleEvents();if(!events.length){const msg=document.createElement("div");msg.id="timeline-empty-msg";msg.textContent=UI_TEXT[lang].noEvents;box.appendChild(msg);return;}let lastYear=null;events.forEach(ev=>{const item=document.createElement("div"),photos=photosOf(ev);item.className="badge-item"+(photos.length===1?" single-photo":"");item.dataset.id=String(ev.id);item.tabIndex=0;item.setAttribute("role","button");item.setAttribute("aria-label",evTitle(ev));if(String(yearOf(ev))!==String(lastYear)){const y=document.createElement("div");y.className="year-label";y.textContent=yearOf(ev);item.appendChild(y);lastYear=yearOf(ev);}const hook=document.createElement("div");hook.innerHTML=HOOK_SVG;item.appendChild(hook.firstChild);if(photos[0]){const img=document.createElement("img");img.src=imgUrl(photos[0]);img.alt=evTitle(ev);item.appendChild(img);}item.addEventListener("click",()=>selectEvent(ev.id));item.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectEvent(ev.id);}});item.classList.toggle("selected",selectedId!==null&&String(ev.id)===String(selectedId));box.appendChild(item);});}
function getModeForZoom(zoom){return zoom>=CLOSE_ZOOM_THRESHOLD?"close":zoom>=FAR_ZOOM_THRESHOLD?"cluster":"far";}
function initMap(){FlagLayout=ymaps.templateLayoutFactory.createClass('<div class="map-flag-wrap {{ properties.selectedClass }}">{{ properties.flagHtml|raw }}</div>');$("map").replaceChildren();map=new ymaps.Map("map",{center:[30,30],zoom:2,controls:["zoomControl"]});plainCollection=new ymaps.GeoObjectCollection();clusterer=new ymaps.Clusterer({preset:"islands#invertedBlueClusterIcons",groupByCoordinates:false,clusterDisableClickZoom:false,minClusterSize:2,gridSize:CLUSTER_GRID_SIZE});map.geoObjects.add(plainCollection);map.geoObjects.add(clusterer);map.events.add("boundschange",()=>{const zoom=map.getZoom();$("map").classList.toggle("zoom-close",zoom>=CLOSE_ZOOM_THRESHOLD);const next=getModeForZoom(zoom);if(next!==currentMode){currentMode=next;renderMap();}});currentMode=getModeForZoom(map.getZoom());renderMap();}
function buildFlagPlacemark(ev){const tags=tagsOf(ev),color=tags[0]?.color||"#2563eb",pm=new ymaps.Placemark(coords(ev),{eventId:String(ev.id),flagHtml:flagSvg(color),selectedClass:selectedId!==null&&String(ev.id)===String(selectedId)?"selected":""},{iconLayout:FlagLayout,iconShape:{type:"Rectangle",coordinates:[[0,0],[16,20]]},iconOffset:[-1,-19]});pm.events.add("click",()=>selectEvent(ev.id));return pm;}
function renderMap(){if(!plainCollection||!clusterer)return;plainCollection.removeAll();clusterer.removeAll();const markers=visibleEvents().filter(ev=>coords(ev)).map(buildFlagPlacemark);if(currentMode==="cluster")clusterer.add(markers);else markers.forEach(pm=>plainCollection.add(pm));}
function markSelection(){const update=pm=>pm.properties.set("selectedClass",String(pm.properties.get("eventId"))===String(selectedId)?"selected":"");if(plainCollection)plainCollection.each(update);if(clusterer)clusterer.getGeoObjects().forEach(update);}
function focusOnMap(ev){const point=coords(ev);if(map&&point)map.setCenter(point,Math.max(map.getZoom(),6),{duration:400});}
let lightboxReturnFocus=null;
function openLightbox(src){lightboxReturnFocus=document.activeElement;$("lightbox-img").src=src;$("lightbox-overlay").classList.add("open");$("lightbox-close").focus();}
function closeLightbox(){const wasOpen=$("lightbox-overlay").classList.contains("open");$("lightbox-overlay").classList.remove("open");$("lightbox-img").removeAttribute("src");if(wasOpen&&lightboxReturnFocus)lightboxReturnFocus.focus();}
function makeZoomable(img){img.classList.add("zoomable-photo");img.alt=img.alt||(lang==="ru"?"Фотография мероприятия":"Event photo");img.tabIndex=0;img.setAttribute("role","button");img.addEventListener("click",e=>{e.stopPropagation();openLightbox(img.src);});img.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLightbox(img.src);}});return img;}
function appendPhoto(wrap,path){const img=document.createElement("img");img.src=imgUrl(path);wrap.appendChild(makeZoomable(img));}
function renderInfoPhotos(ev){const box=$("info-photos-container"),photos=photosOf(ev);box.replaceChildren();const shown=photos.length<=1?photos:photos.slice(1),wrap=document.createElement("div");wrap.className=shown.length<=2?"info-photos-row":"info-carousel";shown.forEach(p=>appendPhoto(wrap,p));box.appendChild(wrap);}
function renderInfoGallery(ev){const box=$("info-gallery-container"),photos=galleryOf(ev);box.replaceChildren();if(!photos.length)return;const title=document.createElement("div");title.className="info-gallery-title";title.textContent=UI_TEXT[lang].gallery;box.appendChild(title);const wrap=document.createElement("div");wrap.className="info-carousel";photos.forEach(p=>appendPhoto(wrap,p));box.appendChild(wrap);}
function selectEvent(id,focus=true){const ev=ALL_EVENTS.find(e=>String(e.id)===String(id));if(!ev)return;selectedId=ev.id;document.querySelectorAll(".badge-item").forEach(el=>el.classList.toggle("selected",el.dataset.id===String(ev.id)));markSelection();if(focus)focusOnMap(ev);$("info-empty").style.display="none";$("info-content").style.display="block";$("info-number").textContent=chronologicalNumber(id);$("info-title").textContent=evTitle(ev);$("info-date").textContent=[fmtDateRange(ev),ev.city].filter(Boolean).join(" · ");renderInfoPhotos(ev);$("info-desc").textContent=evDesc(ev);const tags=$("info-tags");tags.replaceChildren();tagsOf(ev).forEach(t=>{const chip=document.createElement("span");chip.className="tag-chip";chip.style.background=safeColor(t.color);chip.textContent=t.name;tags.appendChild(chip);});const talk=$("info-talk");talk.replaceChildren();if(ev.talk_file){const a=document.createElement("a");a.href=imgUrl(ev.talk_file);a.target="_blank";a.rel="noopener noreferrer";a.className="talk-file";a.textContent=UI_TEXT[lang].talk;talk.appendChild(a);}renderInfoGallery(ev);}
function startMap(){const script=document.createElement("script");script.src="https://api-maps.yandex.ru/2.1/?apikey="+encodeURIComponent(MAP_API_KEY)+"&lang=ru_RU";script.async=true;let initialized=false;function mapError(message){if(initialized)return;$("map").textContent=message;showDebug(message+" Лента и карточки работают независимо от карты.");}const timer=setTimeout(()=>mapError("Яндекс.Карты не загрузились за 20 секунд. Проверьте сеть и ограничения ключа API."),20000);script.onerror=()=>{clearTimeout(timer);mapError("Не удалось загрузить скрипт Яндекс.Карт.");};script.onload=()=>{if(!window.ymaps){clearTimeout(timer);mapError("API Яндекс.Карт недоступен.");return;}ymaps.ready(()=>{clearTimeout(timer);try{initMap();initialized=true;}catch(err){mapError("Ошибка карты: "+err.message);}});};document.head.appendChild(script);}
document.querySelectorAll(".lang-switch button").forEach(btn=>btn.addEventListener("click",()=>setLang(btn.dataset.lang)));
$("timeline-scroll").addEventListener("wheel",e=>{const el=e.currentTarget;if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&el.scrollWidth>el.clientWidth){e.preventDefault();el.scrollLeft+=e.deltaY;}},{passive:false});
$("lightbox-overlay").addEventListener("click",closeLightbox);$("lightbox-img").addEventListener("click",e=>e.stopPropagation());document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLightbox();if(e.key==="Tab"&&$("lightbox-overlay").classList.contains("open")){e.preventDefault();$("lightbox-close").focus();}});
applyUiText();loadEvents();startMap();
})();

</script>
</body>
</html>
