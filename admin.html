<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ — Конференции и мероприятия</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#111}button,input{font:inherit}button,a,input{touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}

body{background:#f5f7ff}#admin-app{max-width:760px;margin:40px auto;padding:30px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}#admin-app h2{margin-top:0}.back-link{display:inline-block;margin-bottom:22px;color:#2563eb;text-decoration:none}.form-row{margin-bottom:16px;display:flex;flex-direction:column;gap:6px}.form-row input[type=password]{padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;width:100%}.primary-btn{background:#2563eb;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-size:15px;cursor:pointer;width:100%}.login-status,.panel-status{font-size:13px;color:#dc2626;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}.add-link{background:#2563eb;color:#fff;padding:9px 16px;border-radius:8px;text-decoration:none;font-size:14px}.logout-link{background:#f3f4f6;color:#111;padding:9px 16px;border-radius:8px;text-decoration:none;font-size:14px;border:none;cursor:pointer}.event-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #e5e7eb;gap:10px}.event-row img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0}.event-info{display:flex;align-items:center;gap:10px;flex:1;font-size:14px;min-width:0}.event-info span{overflow-wrap:anywhere}.event-actions{display:flex;gap:8px;flex-wrap:wrap}.edit-btn{background:#eef2ff;color:#2563eb;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none}.delete-btn{background:#fee2e2;color:#b91c1c;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}.tag-manage-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e5e7eb}.current-tag-chip{padding:4px 12px;border-radius:20px;font-size:12px;color:#fff;min-width:80px;text-align:center}.tag-manage-row input[type=text]{flex:1;min-width:0;padding:8px 10px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px}.tag-manage-row input[type=color]{width:36px;height:34px;border:none;border-radius:8px;padding:0;flex-shrink:0}.tag-save-btn{background:#2563eb;color:#fff;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}#tags-section{margin-top:32px}[hidden]{display:none!important}@media(max-width:650px){#admin-app{margin:16px 10px;padding:18px}.event-row{align-items:flex-start;flex-direction:column}.tag-manage-row{flex-wrap:wrap}.tag-manage-row input[type=text]{flex-basis:45%}}

</style>
</head>
<body>
<main id="admin-app">
<a class="back-link" href="./index.html">← Конференции и мероприятия</a>
<section id="login-block"><h2>Вход в админку</h2><form id="login-form"><div class="form-row"><label for="admin-password">Пароль</label><input type="password" id="admin-password" placeholder="Пароль" autocomplete="current-password" required></div><button type="submit" class="primary-btn" id="login-btn">Войти</button></form><div class="login-status" id="login-status" role="status" aria-live="polite"></div></section>
<section id="panel-block" hidden><div class="top-actions"><a class="add-link" href="./add-event.html">+ Добавить мероприятие</a><button type="button" class="logout-link" id="logout-btn">Выйти</button></div><div class="panel-status" id="panel-status" role="status" aria-live="polite"></div><h2>Все мероприятия</h2><div id="events-list"></div><section id="tags-section"><h2>Управление тегами</h2><div id="tags-management-list"></div></section></section>
</main>

<script>

(function(){
"use strict";
const BACKEND_URL="https://functions.yandexcloud.net/d4e2ne6v7giu3cm7treu",$=id=>document.getElementById(id);
let memoryToken=null,sessionVersion=0;
function getAdminToken(){try{return localStorage.getItem("adminToken")||memoryToken;}catch(e){return memoryToken;}}
function setAdminToken(t){memoryToken=t;try{localStorage.setItem("adminToken",t);}catch(e){}}
function clearAdminToken(){memoryToken=null;try{localStorage.removeItem("adminToken");}catch(e){}}
function imgUrl(path){return path?BACKEND_URL+"?action=image&path="+encodeURIComponent(path):"";}
function safeColor(value){return /^#[0-9a-f]{6}$/i.test(String(value))?value:"#2563eb";}
function showLogin(message=""){sessionVersion++;$("login-block").hidden=false;$("panel-block").hidden=true;$("events-list").replaceChildren();$("tags-management-list").replaceChildren();$("panel-status").textContent="";$("login-status").textContent=message;}
async function api(action,{method="GET",body,auth=false}={}){const headers={},token=getAdminToken();if(auth){if(!token){const err=new Error("Войдите в админку заново.");err.status=401;throw err;}headers["X-Admin-Token"]=token;}if(body!==undefined)headers["Content-Type"]="application/json";const res=await fetch(BACKEND_URL+"?action="+encodeURIComponent(action)+"&_="+Date.now(),{method,headers,cache:"no-store",...(body!==undefined?{body:JSON.stringify(body)}:{})});const raw=await res.text();let data;try{data=raw?JSON.parse(raw):{};}catch(e){const err=new Error("Сервер вернул некорректный JSON (HTTP "+res.status+").");err.status=res.status;throw err;}if(!res.ok||data?.ok===false){const err=new Error(data?.error||"Ошибка сервера: HTTP "+res.status);err.status=res.status;throw err;}return data;}
function handlePanelError(err){if(err.status===401){clearAdminToken();showLogin("Сессия истекла. Войдите заново.");}else $("panel-status").textContent=err.message;}
async function loadAll(){const version=sessionVersion;$("panel-status").textContent="";$("events-list").textContent="Загрузка…";try{const events=await api("events");if(version!==sessionVersion||$("panel-block").hidden)return;if(!Array.isArray(events))throw new Error("Сервер вернул не список мероприятий.");const valid=events.filter(ev=>ev&&typeof ev==="object");valid.sort((a,b)=>(Date.parse(a.date_start)||0)-(Date.parse(b.date_start)||0));renderEvents(valid);renderTags(valid);}catch(err){if(version!==sessionVersion)return;$("events-list").replaceChildren();handlePanelError(err);}}
async function showPanel(){sessionVersion++;$("login-block").hidden=true;$("panel-block").hidden=false;$("admin-password").value="";await loadAll();}
async function checkAuthOnLoad(){if(!getAdminToken()){showLogin();return;}$("login-status").textContent="Проверяю сессию…";try{const data=await api("admin_check",{auth:true});if(data.is_admin)await showPanel();else{clearAdminToken();showLogin();}}catch(err){if(err.status===401)clearAdminToken();showLogin("Не удалось проверить сессию: "+err.message);}}
$("login-form").addEventListener("submit",async e=>{e.preventDefault();const btn=$("login-btn"),status=$("login-status");btn.disabled=true;status.textContent="Вхожу…";try{const data=await api("admin_login",{method:"POST",body:{password:$("admin-password").value}});if(!data.ok||typeof data.token!=="string"||!data.token)throw new Error(data.error||"Сервер не вернул токен входа.");setAdminToken(data.token);status.textContent="";await showPanel();}catch(err){status.textContent="Не удалось войти: "+err.message;}finally{btn.disabled=false;}});
$("logout-btn").addEventListener("click",()=>{clearAdminToken();showLogin();});
function renderEvents(events){const box=$("events-list");box.replaceChildren();if(!events.length){const p=document.createElement("p");p.textContent="Пока нет мероприятий.";box.appendChild(p);return;}events.forEach(ev=>{const row=document.createElement("div");row.className="event-row";const info=document.createElement("div");info.className="event-info";const photo=Array.isArray(ev.photos)?ev.photos[0]:null;if(photo){const img=document.createElement("img");img.src=imgUrl(photo);img.alt=ev.title_ru||"Бейджик";img.loading="lazy";info.appendChild(img);}const text=document.createElement("span");text.textContent=[ev.date_start,ev.city,ev.title_ru||ev.title_en].filter(Boolean).join(" · ");info.appendChild(text);row.appendChild(info);const actions=document.createElement("div");actions.className="event-actions";const edit=document.createElement("a");edit.className="edit-btn";edit.textContent="Редактировать";edit.href="./add-event.html?id="+encodeURIComponent(ev.id);actions.appendChild(edit);const del=document.createElement("button");del.type="button";del.className="delete-btn";del.textContent="Удалить";del.addEventListener("click",()=>deleteEvent(ev.id,del));actions.appendChild(del);row.appendChild(actions);box.appendChild(row);});}
async function deleteEvent(id,button){if(!window.confirm("Удалить это мероприятие? Удаление связанных файлов зависит от реализации вашей облачной функции."))return;button.disabled=true;try{await api("admin_delete_event",{method:"POST",auth:true,body:{id}});await loadAll();}catch(err){handlePanelError(err);}finally{button.disabled=false;}}
function renderTags(events){const box=$("tags-management-list"),seen=new Map();box.replaceChildren();events.forEach(ev=>(Array.isArray(ev.tags)?ev.tags:[]).forEach(t=>{if(t&&typeof t.name==="string"&&t.name.trim()&&!seen.has(t.name.toLowerCase()))seen.set(t.name.toLowerCase(),t);}));if(!seen.size){const p=document.createElement("p");p.textContent="Пока нет тегов.";box.appendChild(p);return;}seen.forEach(tag=>{const row=document.createElement("div");row.className="tag-manage-row";const chip=document.createElement("span");chip.className="current-tag-chip";chip.style.background=safeColor(tag.color);chip.textContent=tag.name;row.appendChild(chip);const name=document.createElement("input");name.type="text";name.value=tag.name;name.setAttribute("aria-label","Название тега "+tag.name);row.appendChild(name);const color=document.createElement("input");color.type="color";color.value=safeColor(tag.color);color.setAttribute("aria-label","Цвет тега "+tag.name);row.appendChild(color);const save=document.createElement("button");save.type="button";save.className="tag-save-btn";save.textContent="Сохранить везде";save.addEventListener("click",async()=>{const newName=name.value.trim();if(!newName){window.alert("Название тега не может быть пустым");return;}if(!window.confirm(`Изменить тег «${tag.name}» на «${newName}» во всех мероприятиях, где он используется?`))return;save.disabled=true;save.textContent="Сохраняю…";try{const data=await api("admin_update_tag",{method:"POST",auth:true,body:{old_name:tag.name,new_name:newName,new_color:color.value}});window.alert("Тег обновлён в "+(data.updated_events??"нескольких")+" мероприятиях");await loadAll();}catch(err){handlePanelError(err);save.disabled=false;save.textContent="Сохранить везде";}});row.appendChild(save);box.appendChild(row);});}
checkAuthOnLoad();
})();

</script>
</body>
</html>
